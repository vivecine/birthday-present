<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#f4e7df" />
  <title>生日快乐亲爱的♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', serif; color:#694b50; background:#f4e7df; }
    .screen { position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:32px 22px; text-align:center; overflow:hidden; }
    #cover { background:linear-gradient(160deg,rgba(250,232,226,.55),rgba(235,192,194,.6)),url('assets/background.jpg') center/cover; }
    .paper { background:rgba(255,251,249,.74); border:1px solid rgba(255,255,255,.85); box-shadow:0 22px 70px #a87d873b; backdrop-filter:blur(6px); padding:36px 25px; border-radius:28px; width:min(100%,410px); }
    .eyebrow { letter-spacing:.24em; font-size:11px; text-transform:uppercase; }
    .signature { display:block; width:100%; height:auto; margin:22px auto 10px; overflow:visible; }
    .signature-wrap { position:relative; width:100%; aspect-ratio:124 / 59; margin:22px auto 10px; }
    .signature-wrap .signature { position:absolute; inset:0; width:100%; height:100%; margin:0; }
    .signature path { fill:none; stroke:#b75d70; stroke-width:1.28; stroke-linecap:round; stroke-linejoin:round; }
    .caption { font-size:18px; line-height:1.9; letter-spacing:.09em; }
    #game h1, .modal h2 { font-family:'ZCOOL XiaoWei','Songti SC',serif; font-weight:400; letter-spacing:.11em; }
    button { font-family:'ZCOOL XiaoWei','Songti SC',serif; letter-spacing:.09em; }
    .wheel-shell { filter:drop-shadow(0 16px 21px rgba(95,45,65,.2)); }
    .hub { background:#fff8ed; box-shadow:0 0 0 5px rgba(255,255,255,.55),0 2px 12px #0002; }
    #wheel { touch-action:pan-y; }
    button { border:0; color:white; background:#b96e80; border-radius:999px; padding:14px 32px; font-size:16px; cursor:pointer; box-shadow:0 9px 22px #b96e8050; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #enter { opacity:0; pointer-events:none; transition:opacity .8s; margin-top:16px; }
    #enter.ready { opacity:1; pointer-events:auto; }
    #game {
   display: none;
   background-image:
     linear-gradient(
       rgba(255, 255, 255, 0.25),
       rgba(255, 255, 255, 0.25)
     ),
     url('assets/background.jpg');
   background-size: cover;
   background-position: center;
   background-repeat: no-repeat;
   }

    #musicToggle { position:fixed; top:max(16px, env(safe-area-inset-top)); right:16px; z-index:50; font-size:13px; padding:10px 14px; background:rgba(145,80,102,.88); backdrop-filter:blur(5px); }
    #game h1 { margin:0 0 5px; font-size:25px; color: #ffffff; }
    #game p { margin:0 0 22px; line-height:1.6; }
    .wheel-shell { position:relative; width:min(84vw,375px); aspect-ratio:1; margin:0 auto 24px; }
    #wheel { position:absolute; inset:0; }
    .pointer { position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:2; width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-top:32px solid #8b4b5d; filter:drop-shadow(0 3px 2px #0002); }
    .hub { width:48px; height:48px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fffaf6; border:6px solid #d59aa5; border-radius:50%; z-index:1; pointer-events:none; box-shadow:0 1px 10px #0002; }
    #notice { margin:15px auto; font-size:13px; min-height:20px; }
    #result { display:none; position:fixed; inset:0; z-index:10; background:#49313c99; padding:20px; align-items:center; justify-content:center; }
    #result.open { display:flex; }
    .modal { background:#fffaf7; padding:32px 24px; border-radius:28px; width:min(100%,350px); box-shadow:0 25px 90px #28121a55; }
    .modal h2 { font-size:26px; }
    .muted { font-size:12px; opacity:.65; margin-top:30px; }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;}}
  </style>

      <button id="enter">到底是什么神秘礼物呢？ →</button>
    </div>
  </section>
  <section id="game" class="screen">
    <h1>是抽奖转盘！😌</h1>
    <p></p>
    <div class="wheel-shell"><div class="pointer" aria-hidden="true"></div><div id="wheel"></div><div class="hub" aria-hidden="true"></div></div>
    <button id="spin" disabled>抽！</button>
  </section>
  <div id="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal"><div style="font-size:34px">💌</div><h2 id="resultTitle">生日快乐🥰</h2><p id="prizeText"></p><button id="close">亲亲宝贝！</button></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vivus@0.4.6/dist/vivus.min.js"></script>
  <script type="module">
    import {Wheel} from "https://cdn.jsdelivr.net/npm/spin-wheel@5.0.2/dist/spin-wheel-esm.js";
    const prizes = ['ALL', 'iPhone 18 Pro Max', '手作蓝晒贺卡', 'd20骰子盲盒', '艾玛莫莉玩偶香薰', '神秘游戏兑换码'];
    const colors = ['#f4b6b6','#fff0d4','#d9bddc','#f7d7c9','#d5e6dd','#f2d8ea'];
    const enter = document.querySelector('#enter');
    const spinButton = document.querySelector('#spin');
    const showEnter = () => enter.classList.add('ready');
    if (window.Vivus) {
      const secondWriting = new Vivus('handwriting-second', {
        type: 'oneByOne', duration: 150, start: 'manual'
      }, showEnter);
      const firstWriting = new Vivus('handwriting-first', {
        type: 'oneByOne', duration: 110, start: 'manual'
      }, () => {
        setTimeout(() => secondWriting.play(), 800);
      });
      firstWriting.play();
    } else { showEnter(); }
    let wheel = null;
    let spinning = false;
    function initWheel() {
      if(wheel) return;
      wheel = new Wheel(document.querySelector('#wheel'), {
        items: prizes.map(label => ({label})),
        itemBackgroundColors: colors,
        itemLabelColors: ['#6c4853'],
        itemLabelFont: 'ZCOOL XiaoWei, Songti SC, serif',
        itemLabelFontSizeMax: 23,
        itemLabelRadius: .64,
        itemLabelRadiusMax: .32,
        itemLabelAlign: 'center',
        pointerAngle: 0,
        isInteractive: false,
        rotationResistance: 0,
        lineColor: '#fffaf6',
        lineWidth: 3,
        onRest: (event) => {
          if (!spinning) return;
          spinning = false;
          spinButton.disabled = false;
          document.querySelector('#prizeText').textContent = '当然是' + prizes[event.currentIndex] +'了😌';
          document.querySelector('#result').classList.add('open');
        }
      });
      spinButton.disabled = false;
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        wheel.spin(12);
      }
    }   
const music = document.querySelector('#bgMusic');
    const musicToggle = document.querySelector('#musicToggle');
    music.volume = 0.5;
    music.addEventListener('play', () => { musicToggle.textContent = '♫'; });
    music.addEventListener('pause', () => { musicToggle.textContent = '♫'; });
    music.addEventListener('error', () => { musicToggle.textContent = '⚠ 音乐未加载'; });
    function playMusic() {
      music.play().catch(err => {
        console.warn('音乐播放失败，请检查 assets/music.mp3 或浏览器权限：', err);
        musicToggle.textContent = '♫ 点击播放音乐';
      });
    }
    musicToggle.addEventListener('click', () => {
      if (music.paused) playMusic(); else music.pause();
    });
    enter.addEventListener('click', () => {
      playMusic();
      document.querySelector('#cover').style.display = 'none';
      document.querySelector('#game').style.display = 'flex';
      initWheel();
    });
    spinButton.addEventListener('click', () => {
      if(!wheel || spinning) return;
      wheel.stop();
      spinning=true;
      spinButton.disabled=true;
      const winner = 0;
      wheel.spinToItem(winner, 4800, true, 6, 1);
    });
    document.querySelector('#close').addEventListener('click', () => {
      document.querySelector('#result').classList.remove('open');
      if (wheel && !spinning && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        wheel.spin(12); 
      }
    });
  </script>
